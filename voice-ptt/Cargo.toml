[package]
name = "voice-ptt"
version = "0.1.0"
edition = "2021"
description = "High-performance Push-to-Talk voice typing for Windows (Persian-first)"
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
anyhow = "1"

# Config / serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Audio capture (WASAPI Shared Mode by default)
cpal = "0.15"

# Local ASR engine (whisper.cpp bindings)
whisper-rs = "0.16"

# Fast dictionary matching for technical terms
aho-corasick = "1.1"

# Tensor views for ONNX inputs (must match ort's ndarray version)
ndarray = "0.16"

# Model downloader + optional cloud ASR (the only network use in the app)
reqwest = { version = "0.12", features = ["stream", "blocking", "multipart", "json"] }
futures-util = "0.3"

# Silero VAD via ONNX Runtime (optional feature; RMS fallback is always available)
ort = { version = "=2.0.0-rc.10", optional = true }

[target.'cfg(windows)'.dependencies]
# Win32 API (hotkey hook, text injection, hardware probe)
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
] }

# System tray + floating overlay GUI
tray-icon = "0.14"
eframe = "0.28"

[features]
default = ["silero-vad"]
silero-vad = ["dep:ort"]

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "audio_benchmark"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
