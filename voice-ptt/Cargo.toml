[package]
name = "voice-ptt"
version = "0.6.1"
edition = "2021"
description = "High-performance Push-to-Talk voice typing for Windows (Persian-first)"
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
anyhow = "1"

# Config / serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Rolling file logs (%APPDATA%\voice-ptt\logs\voice-ptt.log) that survive
# console-less launches (double-click / tray) and capture panics.
tracing-appender = "0.2"

# Audio capture (WASAPI Shared Mode by default)
cpal = "0.15"

# Local ASR engine (whisper.cpp bindings)
# (native whisper.cpp/ggml logs are redirected into `tracing` in logging.rs,
# so they reach the log file instead of an invisible stderr)
whisper-rs = { version = "0.16", features = ["raw-api"] }

# Fast dictionary matching for technical terms
aho-corasick = "1.1"

# Tensor views for ONNX inputs (must match ort's ndarray version)
ndarray = "0.16"

# Model downloader + optional cloud ASR (the only network use in the app)
reqwest = { version = "0.12", features = ["stream", "blocking", "multipart", "json"] }
futures-util = "0.3"

# Pure-Rust in-memory FLAC encoder for Google Free Speech ASR
flacenc = "0.5.1"

# base64 for the Antigravity bridge: SendAudioChunk carries base64 PCM
base64 = "0.22"

# Persian/Arabic text reshaping and bidirectional layout for GUI
ar-reshaper = "1.5.0"
unicode-bidi = "0.3.18"

# Silero VAD via ONNX Runtime (optional feature; RMS fallback is always available)
ort = { version = "=2.0.0-rc.10", optional = true }

[target.'cfg(windows)'.dependencies]
# Win32 API (hotkey hook, text injection, hardware probe)
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Graphics_Dwm",
    # HRGN, needed by the DWM_BLURBEHIND struct (see
    # window_shape::disable_winit_blur_behind).
    "Win32_Graphics_Gdi",
    # Credential Manager: where the service API key lives instead of config.toml
    "Win32_Security_Credentials",
    # Shell_NotifyIconW: the update balloon. tray-icon does not expose the
    # HWND of the icon it registers, so the balloon carries its own icon.
    "Win32_UI_Shell",
] }

# Raw platform window handle: lets the overlay ask eframe for the *real* main
# HWND (eframe::Frame implements HasWindowHandle) instead of guessing "the app
# window" by title across every window of the UI thread — the guessing is what
# let internal windows (winit's event target, the tray-icon message window) be
# captured and dragged onto the orb.
raw-window-handle = "0.6"

# System tray + floating overlay GUI
tray-icon = "0.14"
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "wgpu"] }

# Ready-made egui components (pinned to the egui 0.28-compatible releases):
# - phosphor icons replace the hand-drawn vector glyphs and emoji buttons
# - egui-notify provides the animated toast notifications
egui-phosphor = "0.6"
egui-notify = "0.15"

# Vendored egui-notify 0.15 with an optional toast width cap
# (Toasts::with_max_width / Toast::set_max_width) — our local port of the
# upstream proposal in ItsEthra/egui-notify#54. Removable once a release
# ships the feature.
[patch.crates-io]
egui-notify = { path = "../third_party/egui-notify" }

[features]
default = ["silero-vad"]
silero-vad = ["dep:ort"]
light-theme = []

[build-dependencies]
winres = "0.1"

[dev-dependencies]
criterion = "0.5"
# The heartbeat's schedule is verified against a clock the test moves by hand
# (`tokio::time::freeze` / `advance`), so the assertions are about *which*
# deadline a beat lands on rather than about how fast this machine is. Dev-only:
# the app's dependency on tokio is untouched.
tokio = { version = "1", features = ["test-util"] }

[[bench]]
name = "audio_benchmark"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Unwind instead of abort: the panic hook writes the message + backtrace to
# the log file before the process dies. `panic = "abort"` discarded all of it.
panic = "unwind"
strip = false
debug = "limited"
